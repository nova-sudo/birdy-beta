      <div style="flex:1; max-width:420px; margin:0 auto; height:38px; background:#F4F4F8; border:1px solid #ECECF2; border-radius:10px; display:flex; align-items:center; padding:0 13px; gap:9px; color:#9A9AAB;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B4EE6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17l-1.9-5.1L4.5 10l5.6-1.4z"/></svg><span style="font-size:13.5px;">Ask Birdy about your marketing data…</span><span style="margin-left:auto; font-size:11px; background:#EAEAF0; padding:2px 7px; border-radius:5px;">⌘K</span></div>
      <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
        <div style="position:relative; width:38px; height:38px; border-radius:10px; background:#F4F4F8; display:flex; align-items:center; justify-content:center; color:#5A5A6E;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span style="position:absolute; top:-4px; right:-4px; background:#E5484D; color:#fff; font-size:10px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;">9</span></div>
        <div style="width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#7B5FE6,#6B4EE6); display:flex; align-items:center; justify-content:center; color:#fff;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
      </div>
    </div>

    <div class="scrolly" style="flex:1; min-height:0; padding:22px 24px;">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
        <div style="display:flex; gap:5px; background:#F1F1F5; border:1px solid #ECECF2; border-radius:10px; padding:4px;">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
            <div onClick="{{ t.pick }}" style="cursor:pointer; padding:9px 20px; border-radius:8px; font-family:'Poppins',sans-serif; font-weight:600; font-size:13px; color:{{ t.color }}; background:{{ t.bg }}; box-shadow:{{ t.shadow }};">{{ t.label }}</div>
          </sc-for>
        </div>
        <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
          <div style="display:flex; align-items:center; gap:9px; height:38px; width:220px; background:#fff; border:1px solid #ECECF2; border-radius:10px; padding:0 13px; color:#9A9AAB;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg><span style="font-size:13px;">Search metrics…</span></div>
          <div style="width:38px; height:38px; border-radius:10px; background:#6B4EE6; display:flex; align-items:center; justify-content:center; color:#fff;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
        </div>
      </div>

      <div style="background:#fff; border:1px solid #ECECF2; border-radius:16px; overflow:hidden;">
        <div style="display:flex; align-items:center; padding:13px 22px; border-bottom:1px solid #ECECF2; background:#FAFAFC; font-size:11.5px; font-weight:700; letter-spacing:.03em; color:#9A9AAB;">
          <div style="flex:1;">METRIC NAME</div>
          <div style="flex:1.4;">NOTES</div>
          <div style="flex:0 0 200px; text-align:center;">SOURCE</div>
          <div style="flex:0 0 160px; text-align:center;">{{ controlsLabel }}</div>
        </div>
        <sc-for list="{{ rows }}" as="m" hint-placeholder-count="8">
          <div style="display:flex; align-items:center; padding:12px 22px; border-bottom:1px solid #F5F5F8;">
            <div style="flex:1; padding-right:12px;">
              <div style="font-size:13.5px; font-weight:600; color:#1F1B33;">{{ m.name }}</div>
            </div>
            <div style="flex:1.4; padding-right:12px; font-size:12.5px; color:#8A8A9A;">{{ m.sub }}</div>
            <div style="flex:0 0 200px; display:flex; justify-content:center;"><span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:{{ m.srcColor }}; background:{{ m.srcBg }}; border:1px solid {{ m.srcBorder }}; padding:4px 11px; border-radius:999px;">{{ m.srcIcon }}{{ m.source }}</span></div>
            <div style="flex:0 0 160px; display:flex; align-items:center; justify-content:center; gap:8px;">
              <span onClick="{{ m.toggleVis }}" style="display:{{ m.standardShow }}; cursor:pointer; width:26px; height:26px; border-radius:8px; border:1px solid #ECECF2; align-items:center; justify-content:center; color:#5A5A6E;">{{ m.eyeIcon }}</span>
              <span onClick="{{ m.editStandard }}" style="display:{{ m.standardShow }}; cursor:pointer; width:26px; height:26px; border-radius:8px; border:1px solid #ECECF2; align-items:center; justify-content:center; color:#6B4EE6;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></span>
              <span onClick="{{ m.edit }}" style="display:{{ m.customShow }}; cursor:pointer; width:26px; height:26px; border-radius:8px; border:1px solid #ECECF2; align-items:center; justify-content:center; color:#6B4EE6;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg></span>
              <span onClick="{{ m.dup }}" style="display:{{ m.dupShow }}; cursor:pointer; width:26px; height:26px; border-radius:8px; border:1px solid #ECECF2; align-items:center; justify-content:center; color:#5A5A6E;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></span>
              <span onClick="{{ m.del }}" style="display:{{ m.delShow }}; cursor:pointer; width:26px; height:26px; border-radius:8px; border:1px solid #ECECF2; align-items:center; justify-content:center; color:#E5484D;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></span>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:18px;">
        <span onClick="{{ prevPage }}" style="display:flex; align-items:center; gap:5px; padding:8px 14px; border-radius:9px; font-size:13.5px; font-weight:600; color:#5A5A6E; cursor:pointer;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Previous</span>
        <sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
          <span onClick="{{ p.pick }}" style="display:{{ p.show }}; align-items:center; justify-content:center; min-width:36px; height:36px; padding:0 6px; border-radius:9px; font-size:13.5px; font-weight:600; color:{{ p.color }}; background:{{ p.bg }}; box-shadow:{{ p.shadow }}; cursor:pointer;">{{ p.label }}</span>
        </sc-for>
        <span onClick="{{ nextPage }}" style="display:flex; align-items:center; gap:5px; padding:8px 14px; border-radius:9px; font-size:13.5px; font-weight:600; color:#5A5A6E; cursor:pointer;">Next<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>
  </div>
</div>


</x-dc>
<script type="text/x-dc" data-dc-script>

      { name: 'Meta Spend', source: 'Meta Ads', dashboard: 'All', type: 'meta' },
      { name: 'Impressions', source: 'Meta Ads', dashboard: 'All', type: 'meta' },
      { name: 'Clicks', source: 'Meta Ads', dashboard: 'All', type: 'meta' },

    const stdRows = STANDARD.map((m) => {
      const s = srcStyle(m.type);
      const visible = !st.hidden[m.name];
      return { name: m.name, type: m.type, sub: '–', source: m.source, srcColor: s.color, srcBg: s.bg, srcBorder: s.border, srcIcon: s.icon, dashboard: m.dashboard, standardShow: 'flex', customShow: 'none', dupShow: 'none', delShow: 'none', edit: () => {}, dup: () => {}, del: () => {}, editStandard: () => {}, eyeIcon: visible ? EYE : EYE_OFF, toggleVis: () => this.setState((s2) => ({ hidden: Object.assign({}, s2.hidden, { [m.name]: visible }) })) };
    });
    const customRows = CUSTOM.map((m) => ({
      name: m.name, sub: m.sub || '–', eyeIcon: EYE, toggleVis: () => {},
      source: 'Custom Formula', srcColor: '#6B4EE6', srcBg: '#F1EEFC', srcBorder: '#E3DAFB', srcIcon: FORMULA,
      dashboard: m.dashboard, standardShow: 'none', customShow: 'inline-flex', dupShow: 'inline-flex', delShow: 'inline-flex',
      edit: () => {}, dup: () => {}, del: () => {},
    }));

    const DATA = {
      'All Metrics': stdRows.concat(customRows),
      'Sales Metrics': stdRows.filter((r) => r.type === 'sales'),
      'Custom Formulas': customRows,
      'Meta Metrics': stdRows.filter((r) => r.type === 'meta'),
      'GoHighLevel Metrics': stdRows.filter((r) => r.type === 'ghl'),
      'Birdy Metrics': stdRows.filter((r) => r.type === 'birdy'),
      'Tag Metrics': stdRows.filter((r) => r.type === 'tag'),
    };
    const rows = DATA[st.tab] || stdRows;

    const TABS = ['All Metrics', 'GoHighLevel Metrics', 'Meta Metrics', 'Sales Metrics', 'Birdy Metrics', 'Tag Metrics', 'Custom Formulas'];
    const TAB_LABELS = { 'GoHighLevel Metrics': 'GHL Metrics' };
    const tabs = TABS.map((label) => {
      const on = label === st.tab;
      return { label: TAB_LABELS[label] || label, color: on ? '#1F1B33' : '#6B6480', bg: on ? '#fff' : 'transparent', shadow: on ? '0 2px 8px -2px rgba(107,78,230,.35)' : 'none', pick: () => this.setState({ tab: label }) };
    });

    const controlsLabel = (st.tab === 'Custom Formulas') ? 'CONTROLS' : 'SHOW / HIDE';

    const TOTAL_PAGES = 20;
    const cur = st.page;
    const nums = cur <= 2 ? [1, 2] : [1, cur];
    const showEllipsis = cur < TOTAL_PAGES - 1;
    const pageItem = (n, label) => {
      const on = n === cur;
      return { label: label || String(n), show: 'flex', color: on ? '#1F1B33' : '#5A5A6E', bg: on ? '#fff' : 'transparent', shadow: on ? '0 2px 8px -2px rgba(107,78,230,.35)' : 'none', pick: () => this.setState({ page: n }) };
    };
    const pages = [];
    if (cur <= 2) {
      pages.push(pageItem(1), pageItem(2));
    } else {
      pages.push(pageItem(1), pageItem(cur));
    }
    if (showEllipsis) pages.push({ label: '···', show: 'flex', color: '#9A9AAB', bg: 'transparent', pick: () => {} });
    pages.push(pageItem(TOTAL_PAGES));

    const prevPage = () => this.setState((s2) => ({ page: Math.max(1, s2.page - 1) }));
    const nextPage = () => this.setState((s2) => ({ page: Math.min(TOTAL_PAGES, s2.page + 1) }));

    return { tabs, rows, controlsLabel, pages, prevPage, nextPage };
  }
}
</script>
